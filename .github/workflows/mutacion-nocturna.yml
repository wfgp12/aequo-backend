name: Mutacion nocturna

# Corrida completa sobre develop para ver el puntaje global sin frenar los PR.
on:
  schedule:
    - cron: '0 7 * * *' # 2:00 a. m. en Colombia
  workflow_dispatch:

jobs:
  mutacion-completa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-develop-${{ github.run_id }}
          restore-keys: stryker-develop-

      - run: npm run test:mutacion

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-mutacion-completo
          path: reports/mutation

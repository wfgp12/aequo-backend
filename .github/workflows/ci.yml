name: CI

on:
  push:
    branches: [develop, qa, main]
  pull_request:
    branches: [develop, qa, main]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # requerido por el analisis de SonarQube

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:cov

      - uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Cada commit del PR respeta su carril: las pruebas y los criterios solo entran
  # en commits "test:", y un commit "test:" no trae codigo de produccion.
  pruebas-protegidas:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revisar los commits del PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          protegidas='(\.spec\.ts$|^test/|^criterios/[^_])'
          produccion='^src/'
          errores=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            asunto=$(git log -1 --format=%s "$sha")
            archivos=$(git diff-tree --no-commit-id --name-only -r "$sha")
            pruebas=$(echo "$archivos" | grep -E "$protegidas" || true)
            codigo=$(echo "$archivos" | grep -E "$produccion" | grep -vE "$protegidas" || true)
            if [[ "$asunto" =~ ^test(\(.*\))?!?: ]]; then
              if [ -n "$codigo" ]; then
                echo "::error::$sha \"$asunto\" es un commit test: pero modifica codigo de produccion:"; echo "$codigo"; errores=1
              fi
            elif [ -n "$pruebas" ]; then
              echo "::error::$sha \"$asunto\" modifica pruebas o criterios sin ser un commit test::"; echo "$pruebas"; errores=1
            fi
          done
          exit $errores

  # Pruebas de mutacion solo sobre los archivos de logica que cambiaron en el PR.
  mutacion:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-${{ github.base_ref }}-${{ github.run_id }}
          restore-keys: stryker-${{ github.base_ref }}-

      - name: Mutar los archivos cambiados
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Mismas exclusiones que "mutate" en stryker.config.json
          archivos=$(git diff --name-only --diff-filter=AMR "$BASE...HEAD" \
            | grep -E '^src/.*\.ts$' \
            | grep -vE '\.spec\.ts$|/dto/|\.schema\.ts$|\.module\.ts$|\.controller\.ts$|\.enums\.ts$|^src/main\.ts$|^src/common/swagger\.ts$|^src/auth/dev-' \
            | paste -sd, - || true)
          if [ -z "$archivos" ]; then
            echo "No hay archivos de logica que mutar en este PR."
            exit 0
          fi
          echo "Mutando: $archivos"
          npx stryker run --mutate "$archivos"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-mutacion
          path: reports/mutation
          if-no-files-found: ignore
